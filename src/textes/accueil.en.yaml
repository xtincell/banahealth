piliersTitre: Support on three fronts
piliers:
  - titre: Treatment facilitation
    texte: >-
      We find the doctors best suited to your needs, obtain quotations for your
      treatments and arrange every medical appointment.
    lien: our-services
    image: icone-medecins

  - titre: Travel facilitation
    texte: >-
      We ease the process of obtaining your visa and its extensions, help you
      arrange flights and handle transfers between airport and hospital.
    lien: our-services
