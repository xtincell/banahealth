# =====================================================================
# Page d'accueil — français
#
# Chaque bloc correspond à une section de la page, dans l'ordre où
# elle apparaît. Pour retirer une section, supprimez ses entrées ;
# pour en ajouter une, dupliquez une entrée existante.
#
# Dans les titres du carrousel, la portion entre *astérisques*
# s'affiche en orange, comme le « Bana » du logo.
# =====================================================================

diapos:
  - image: accueil-slide-1
    titre: Les *soins* que vous méritez
    texte: >-
      À BanaHealth, nous plaçons nos patients au cœur de tout ce que nous
      faisons. Leur guérison est ce qui nous pousse, jour et nuit.
    lienLibelle: Nos services
    lien: nos-services

  - image: accueil-slide-2
    titre: Nous sommes là *pour vous*
    texte: >-
      Vous ne connaissez jamais votre force, jusqu'au jour où vous n'avez pas
      d'autre choix que d'être fort.
    auteur: Cayla Mills
    lienLibelle: Qui sommes-nous
    lien: notre-fondatrice

  - image: accueil-slide-3
    titre: La plus grande richesse, c'est *la santé*
    texte: >-
      À BanaHealth, nous nous engageons à vous aider à surmonter tous vos
      problèmes de santé, qu'il s'agisse d'une chirurgie esthétique ou d'une
      maladie grave.
    auteur: Virgile
    lienLibelle: Nos réseaux
    lien: nos-reseaux

