name: Publish final verified historical BanaHealth website
on:
  push:
    branches:
      - codex/historique-main-20261030
    paths:
      - .github/workflows/ovh-main.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: ovh-historical-2017-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned SFTP dependencies
        run: python -m pip install 'paramiko==3.5.1' 'cryptography==46.0.3'
      - name: Preserve verified assets and publish corrected HTML revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u ops/publish_main.py
