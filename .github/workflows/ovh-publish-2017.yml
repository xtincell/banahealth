name: Activate verified 2017 preview on OVH
on:
  push:
    branches:
      - codex/ovh-publication-2017-20261029192605
    paths:
      - .github/workflows/ovh-publish-2017.yml
permissions:
  contents: read
  statuses: write
concurrency:
  group: ovh-historical-2017-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned transfer dependencies
        run: python -m pip install 'paramiko==3.5.1' 'cryptography==46.0.3'
      - name: Publish only the historical preview with a one-use encrypted credential
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u ops/publish_2017.py
