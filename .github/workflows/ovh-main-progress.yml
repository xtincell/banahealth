name: Inspect OVH main publication progress
on:
  push:
    branches:
      - codex/historique-main-20261030
    paths:
      - .github/workflows/ovh-main-progress.yml
permissions:
  contents: read
  statuses: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install 'paramiko==3.5.1' 'cryptography==46.0.3'
      - name: Read backup size and staged file counts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -u ops/inspect_main_progress.py
